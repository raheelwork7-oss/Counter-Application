<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="counter-app">
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-dot"></span>
        <h1>Counter</h1>
      </div>
      <button id="reset-btn" class="reset-btn" type="button">Reset</button>
    </header>

    <section class="counter-box">
      <p class="label">Current Value</p>
      <div id="counter-value" class="counter-value" aria-live="polite">0</div>
    </section>

    <div class="controls">
      <button id="decrement-btn" class="control-btn decrement" type="button" aria-label="Decrease counter">−</button>
      <button id="increment-btn" class="control-btn increment" type="button" aria-label="Increase counter">＋</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
